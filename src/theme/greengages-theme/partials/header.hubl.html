<header class="site-header" role="banner">
  <div class="container site-header__inner">
    <a class="site-header__brand" href="/" aria-label="Home">
      {% if theme.brand.logo.src %}
        <img class="site-header__logo" src="{{ theme.brand.logo.src }}" alt="Green Gage logo" loading="eager">
      {% else %}
        <span class="site-header__wordmark">Green Gage</span>
      {% endif %}
    </a>

        <nav class="site-header__nav" aria-label="Primary navigation">
      {% module "header_menu" path="@hubspot/menu", label="Header Menu" %}
    </nav>

    {% module "header_language_switcher" path="../modules/language-switcher.module", label="Language Switcher" %}
    <a href="#main-content" class="visually-hidden focusable-skip">Skip to content</a>
  </div>
</header>
