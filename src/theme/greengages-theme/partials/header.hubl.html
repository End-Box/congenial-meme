<!--
  templateType: global_partial
  label: Site Header
-->
{% include './language-context.hubl.html' %}
<header class="site-header site-header--{{ header_context|replace('_', '-') }}" data-header-context="{{ header_context }}" role="banner">
  <div class="container site-header__inner">
    <div class="site-header__brand-wrap">
      <a class="site-header__brand hs-skip-lang-url-rewrite" href="{{ website_home_url }}" aria-label="{{ 'Home' if current_lang == 'en' else 'Accueil' }}">
        {% if theme.brand.logo.src %}
          <img class="site-header__logo" src="{{ theme.brand.logo.src }}" alt="Green Gage logo" loading="eager">
        {% else %}
          <span class="site-header__wordmark">Green Gage</span>
        {% endif %}
      </a>
    </div>

    <nav class="site-header__nav" aria-label="Primary navigation">
      <div class="site-header__menu {{ 'site-header__menu--en' if current_lang == 'en' else 'site-header__menu--fr' }}">
        {% module "contextual_header_navigation" path="../modules/header-navigation.module", label="Contextual header navigation" %}
      </div>
    </nav>

    <div class="site-header__actions">
      <div class="site-header__language" aria-label="Language selector" data-language-switcher-fallback>
        <button class="lang_switcher_link" type="button" aria-expanded="false" aria-haspopup="true"><span class="globe_class" aria-hidden="true">&#127760;</span><span>{{ 'English' if current_lang == 'en' else 'Français' }}</span><span class="language-chevron" aria-hidden="true">⌄</span></button>
        <ul class="lang_list_class">
          <li><a class="hs-skip-lang-url-rewrite" href="{{ language_en_url }}" lang="en"{% if current_lang == 'en' %} aria-current="page"{% endif %}>English</a></li>
          <li><a class="hs-skip-lang-url-rewrite" href="{{ language_fr_url }}" lang="fr"{% if current_lang == 'fr' %} aria-current="page"{% endif %}>Français</a></li>
        </ul>
      </div>
    </div>

    <a href="#main-content" class="visually-hidden focusable-skip">Skip to content</a>
  </div>
</header>

<script>
(function(){
  var root=document.querySelector('[data-language-switcher-fallback]');
  if(!root) return;
  var btn=root.querySelector('button');
  function close(){root.classList.remove('is-open'); if(btn) btn.setAttribute('aria-expanded','false');}
  function open(){root.classList.add('is-open'); if(btn) btn.setAttribute('aria-expanded','true');}
  if(btn){btn.addEventListener('click',function(e){e.stopPropagation(); root.classList.contains('is-open')?close():open();});}
  document.addEventListener('click',function(e){if(!root.contains(e.target)) close();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape') close();});
})();
</script>
