<!--
  templateType: page
  isAvailableForNewContent: true
  label: Base Layout
-->
<!doctype html>
<html lang="{{ html_lang }}" {{ html_lang_dir }}>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page_meta.html_title }}</title>
    {{ standard_header_includes }}
    <style>
      body { margin:0; background:#f7f4ec; color:#2f352d; }
      .site-header { border-bottom:1px solid #d7d2c6; background:#f7f4ec; }
      .site-header__inner { max-width:1200px; margin:0 auto; padding:1rem 1.25rem; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:1rem; }
      .site-header__inner .hs-menu-wrapper > ul { list-style:none; margin:0; padding:0; display:flex; gap:1.25rem; justify-content:center; }
      .site-header__inner .hs-menu-wrapper ul ul { display:none; }
      .site-header__inner .hs-menu-wrapper a { text-decoration:none; color:#2f352d; }
      .site-header__inner > div:last-child { justify-self:end; }
      main#main-content { max-width:1200px; margin:0 auto; padding:2rem 1.25rem 4rem; }
    </style>
  </head>
  <body>
    {% include "../../partials/header.hubl.html" %}
    <main id="main-content">
      {% block body %}
      {% dnd_area "base_content" %}{% end_dnd_area %}
      {% endblock body %}
    </main>
    {% include "../../partials/footer.hubl.html" %}
    {{ standard_footer_includes }}
  </body>
</html>
