<section class="section" {% if module.section_id %}id="{{ module.section_id }}"{% endif %}{% if module.region_label %} aria-label="{{ module.region_label }}"{% endif %}>
  <div class="container flow flow-lg">
    <h2 class="section-heading">{{ module.heading }}</h2>
    <div class="card-grid card-grid--three service-pillars service-pillars--{{ module.style_variant }}">
      {% for pillar in module.pillars %}
        <article class="surface-card">
          <h3>{{ pillar.title }}</h3>
          <p class="section-body">{{ pillar.description }}</p>
        </article>
      {% endfor %}
    </div>
  </div>
</section>
