{% import '../../partials/macros/section-utils.hubl.html' as section_utils %}
<section {{ section_utils.attrs(module.section_id, 'section', module.region_label) }}>
  <div class="container rich-text-section rich-text-section--{{ module.style_variant }} flow flow-md">
    {% if module.kicker %}<p class="section-kicker">{{ module.kicker }}</p>{% endif %}
    <h2 class="section-heading">{{ module.heading }}</h2>
    <div class="section-body">{{ module.body }}</div>
  </div>
</section>
