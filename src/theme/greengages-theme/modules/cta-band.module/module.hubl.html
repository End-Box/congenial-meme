<section class="section cta-band-section" {% if module.section_id %}id="{{ module.section_id }}"{% endif %}{% if module.region_label %} aria-label="{{ module.region_label }}"{% endif %}>
  <div class="container surface-card cta-band cta-band--{{ module.style_variant }}">
    <h2>{{ module.heading }}</h2>
    {% if module.cta_text and module.cta_link.href %}
      <a class="button button--primary" href="{{ module.cta_link.href }}"
         {% if module.cta_link.open_in_new_tab %}target="_blank"{% endif %}
         {% if module.cta_link.no_follow %}rel="nofollow noopener"{% endif %}>
        {{ module.cta_text }}
      </a>
    {% endif %}
  </div>
</section>
