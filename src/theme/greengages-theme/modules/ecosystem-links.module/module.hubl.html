<section class="section" {% if module.section_id %}id="{{ module.section_id }}"{% endif %}{% if module.region_label %} aria-label="{{ module.region_label }}"{% endif %}>
  <div class="container flow flow-lg">
    <h2 class="section-heading">{{ module.heading }}</h2>
    <ul class="ecosystem-links ecosystem-links--{{ module.style_variant }}">
      {% for item in module.items %}
        <li>
          <a class="surface-card" href="{{ item.link.href|default('#') }}"
             {% if item.link.open_in_new_tab %}target="_blank"{% endif %}
             {% if item.link.no_follow %}rel="nofollow noopener"{% endif %}>
            <strong>{{ item.title }}</strong>
            {% if item.meta %}<span class="section-body">{{ item.meta }}</span>{% endif %}
          </a>
        </li>
      {% endfor %}
    </ul>
  </div>
</section>
