{% import '../../partials/macros/section-utils.html' as section_utils %}
<section {{ section_utils.attrs(module.section_id, 'section', module.region_label) }}>
  <div class="container">
    <article class="manifesto manifesto--{{ module.style_variant }}{% if module.style_variant == 'surface' %} surface-card{% endif %} flow flow-md">
      <h2 class="section-heading">{{ module.heading }}</h2>
      <div class="section-body">{{ module.statement }}</div>
    </article>
  </div>
</section>
